<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Template - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar - Desktop -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/">📊 Dashboard</a>
        <a href="/products">🍞 Produk</a>
        <a href="/templates" class="active">💬 Template</a>
        <a href="/settings">⚙️ Setting</a>
        <a href="/logs">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Kelola Template</h2>
        <p>Edit pesan default bot</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Pesan Welcome</h3>
        </div>
        <div class="form-group">
          <label>Sambutan saat chat baru</label>
          <textarea id="templateWelcome" rows="3" placeholder="Halo! Selamat datang..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveTemplate('welcome')">Simpan</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Pesan Offline</h3>
        </div>
        <div class="form-group">
          <label>Saat admin tidak online</label>
          <textarea id="templateOffline" rows="2" placeholder="Maaf, admin offline..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveTemplate('offline')">Simpan</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>System Prompt AI</h3>
        </div>
        <div class="form-group">
          <label>Instruksi untuk Aurum Brain</label>
          <textarea id="templateSystemPrompt" rows="4" placeholder="Kamu adalah asisten..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveTemplate('systemPrompt')">Simpan</button>
      </div>
    </main>

    <!-- Tab Bar - Mobile -->
    <nav class="tab-bar">
      <div class="tab-bar-nav">
        <a href="/"><span class="tab-icon">🏠</span><span>Home</span></a>
        <a href="/products"><span class="tab-icon">🍞</span><span>Produk</span></a>
        <a href="/templates" class="active"><span class="tab-icon">💬</span><span>Template</span></a>
        <a href="/settings"><span class="tab-icon">⚙️</span><span>Setting</span></a>
        <a href="/logs"><span class="tab-icon">📋</span><span>Log</span></a>
      </div>
    </nav>
  </div>

  <script>
    async function loadTemplates() {
      try {
        const res = await fetch('/api/templates');
        const t = await res.json();
        document.getElementById('templateWelcome').value = t.welcome || '';
        document.getElementById('templateOffline').value = t.offline || '';
        document.getElementById('templateSystemPrompt').value = t.systemPrompt || '';
      } catch (error) {
        console.error('Error:', error);
      }
    }

    async function saveTemplate(type) {
      const el = document.getElementById('template' + type.charAt(0).toUpperCase() + type.slice(1));
      try {
        await fetch('/api/templates', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [type]: el.value })
        });
        showToast('Tersimpan!');
      } catch (error) {
        showToast('Gagal', true);
      }
    }

    function showToast(msg, err = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (err ? ' error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    loadTemplates();
  </script>
</body>
</html>
