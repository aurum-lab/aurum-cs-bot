<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setting - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar - Desktop -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/index.html">📊 Dashboard</a>
        <a href="/products.html">🍞 Produk</a>
        <a href="/templates.html">💬 Template</a>
        <a href="/settings.html" class="active">⚙️ Setting</a>
        <a href="/logs.html">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Setting Bot</h2>
        <p>Konfigurasi WhatsApp Bot</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>WhatsApp</h3>
        </div>
        <div class="form-group">
          <label>Nomor Admin (628xxx)</label>
          <input type="text" id="settingAdminNumber" placeholder="6281234567890">
        </div>
        <div class="form-group">
          <label>Nama Bot</label>
          <input type="text" id="settingBotName" placeholder="RotiBot">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Ollama / AI</h3>
        </div>
        <div class="form-group">
          <label>URL Ollama</label>
          <input type="text" id="settingOllamaUrl" placeholder="http://localhost:11434">
        </div>
        <div class="form-group">
          <label>Model</label>
          <input type="text" id="settingOllamaModel" placeholder="aurum-brain">
        </div>
        <div class="form-group">
          <label>Temperature (0-2)</label>
          <input type="number" id="settingTemperature" min="0" max="2" step="0.1" value="0.7">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
      </div>
    </main>

    <!-- Tab Bar - Mobile -->
    <nav class="tab-bar">
      <div class="tab-bar-nav">
        <a href="/index.html"><span class="tab-icon">🏠</span><span>Home</span></a>
        <a href="/products.html"><span class="tab-icon">🍞</span><span>Produk</span></a>
        <a href="/templates.html"><span class="tab-icon">💬</span><span>Template</span></a>
        <a href="/settings.html" class="active"><span class="tab-icon">⚙️</span><span>Setting</span></a>
        <a href="/logs.html"><span class="tab-icon">📋</span><span>Log</span></a>
      </div>
    </nav>
  </div>

  <script>
    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const s = await res.json();
        document.getElementById('settingAdminNumber').value = s.adminNumber || '';
        document.getElementById('settingBotName').value = s.botName || '';
        document.getElementById('settingOllamaUrl').value = s.ollamaUrl || '';
        document.getElementById('settingOllamaModel').value = s.ollamaModel || '';
        document.getElementById('settingTemperature').value = s.temperature || 0.7;
      } catch (error) {
        console.error('Error:', error);
      }
    }

    async function saveSettings() {
      const settings = {
        adminNumber: document.getElementById('settingAdminNumber').value,
        botName: document.getElementById('settingBotName').value,
        ollamaUrl: document.getElementById('settingOllamaUrl').value,
        ollamaModel: document.getElementById('settingOllamaModel').value,
        temperature: parseFloat(document.getElementById('settingTemperature').value)
      };
      
      try {
        await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings)
        });
        showToast('Tersimpan!');
      } catch (error) {
        showToast('Gagal', true);
      }
    }

    function showToast(msg, err = false) {
      const t = document.createElement('div');
      t.className = 'toast' + (err ? ' error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    loadSettings();
  </script>
</body>
</html>
