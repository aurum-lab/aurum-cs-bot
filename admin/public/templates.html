<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/">📊 Dashboard</a>
        <a href="/products">🍞 Produk</a>
        <a href="/templates" class="active">💬 Template</a>
        <a href="/settings">⚙️ Setting</a>
        <a href="/logs">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Kelola Template</h2>
        <p>Edit pesan default yang digunakan bot</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Pesan Welcome</h3>
        </div>
        <div class="form-group">
          <label>Pesan sambutan saat pelanggan baru chat</label>
          <textarea id="templateWelcome" rows="4" placeholder="Halo! Selamat datang..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveTemplate('welcome')">Simpan</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Pesan Offline</h3>
        </div>
        <div class="form-group">
          <label>Pesan saat admin tidak online</label>
          <textarea id="templateOffline" rows="3" placeholder="Maaf, admin sedang offline..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveTemplate('offline')">Simpan</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>System Prompt AI</h3>
        </div>
        <div class="form-group">
          <label>Instruksi untuk AI (Aurum Brain)</label>
          <textarea id="templateSystemPrompt" rows="6" placeholder="Kamu adalah asisten..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveTemplate('systemPrompt')">Simpan</button>
      </div>
    </main>
  </div>

  <script>
    // Load templates
    async function loadTemplates() {
      try {
        const res = await fetch('/api/templates');
        const templates = await res.json();
        document.getElementById('templateWelcome').value = templates.welcome || '';
        document.getElementById('templateOffline').value = templates.offline || '';
        document.getElementById('templateSystemPrompt').value = templates.systemPrompt || '';
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // Save template
    async function saveTemplate(type) {
      const value = document.getElementById(`template${type.charAt(0).toUpperCase() + type.slice(1)}`).value;
      try {
        await fetch('/api/templates', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [type]: value })
        });
        showToast('Template berhasil disimpan!');
      } catch (error) {
        showToast('Gagal menyimpan template', true);
      }
    }

    // Toast notification
    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    loadTemplates();
  </script>
</body>
</html>
