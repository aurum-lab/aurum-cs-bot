<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Panel - Aurum CS Bot</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar - Desktop -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/index.html" class="active">📊 Dashboard</a>
        <a href="/products.html">🍞 Produk</a>
        <a href="/templates.html">💬 Template</a>
        <a href="/settings.html">⚙️ Setting</a>
        <a href="/logs.html">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Dashboard</h2>
        <p>Ringkasan data Aurum CS Bot</p>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">Produk</div>
          <div class="value accent" id="totalProducts">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Percakapan</div>
          <div class="value success" id="totalConversations">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Kategori</div>
          <div class="value warning" id="totalCategories">-</div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <div class="card-header">
          <h3>Quick Actions</h3>
        </div>
        <div class="quick-actions">
          <a href="/products.html" class="btn btn-primary">+ Tambah Produk</a>
          <a href="/templates.html" class="btn">Edit Template</a>
          <a href="/settings.html" class="btn">Setting Bot</a>
          <a href="/logs.html" class="btn">Lihat Log</a>
        </div>
      </div>

      <!-- Recent Products -->
      <div class="card">
        <div class="card-header">
          <h3>Produk Terbaru</h3>
          <a href="/products.html" class="btn btn-sm">Semua</a>
        </div>
        <div id="recentProducts" class="empty-state">
          <div class="icon">🍞</div>
          <p>Memuat...</p>
        </div>
      </div>
    </main>

    <!-- Tab Bar - Mobile -->
    <nav class="tab-bar">
      <div class="tab-bar-nav">
        <a href="/index.html" class="active">
          <span class="tab-icon">🏠</span>
          <span>Home</span>
        </a>
        <a href="/products.html">
          <span class="tab-icon">🍞</span>
          <span>Produk</span>
        </a>
        <a href="/templates.html">
          <span class="tab-icon">💬</span>
          <span>Template</span>
        </a>
        <a href="/settings.html">
          <span class="tab-icon">⚙️</span>
          <span>Setting</span>
        </a>
        <a href="/logs.html">
          <span class="tab-icon">📋</span>
          <span>Log</span>
        </a>
      </div>
    </nav>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const productsRes = await fetch('/api/products');
        const products = await productsRes.json();
        document.getElementById('totalProducts').textContent = products.length;
        
        const categories = [...new Set(products.map(p => p.category))];
        document.getElementById('totalCategories').textContent = categories.length;
        
        const recent = products.slice(-5).reverse();
        if (recent.length > 0) {
          document.getElementById('recentProducts').innerHTML = recent.map(p => `
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border);">
              <img src="${p.image_url || 'https://via.placeholder.com/50'}" alt="${p.name}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;">
              <div>
                <div style="font-weight:500;font-size:0.9rem;">${p.name}</div>
                <div style="color:var(--text-secondary);font-size:0.8rem;">Rp ${p.price.toLocaleString('id-ID')}</div>
              </div>
            </div>
          `).join('');
        } else {
          document.getElementById('recentProducts').innerHTML = '<p>Belum ada produk</p>';
        }
        
        const logsRes = await fetch('/api/logs');
        const logs = await logsRes.json();
        document.getElementById('totalConversations').textContent = logs.length;
        
      } catch (error) {
        console.error('Error:', error);
      }
    }
    
    loadDashboard();
  </script>
</body>
</html>
