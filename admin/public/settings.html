<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setting - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/">📊 Dashboard</a>
        <a href="/products">🍞 Produk</a>
        <a href="/templates">💬 Template</a>
        <a href="/settings" class="active">⚙️ Setting</a>
        <a href="/logs">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Setting Bot</h2>
        <p>Konfigurasi WhatsApp Bot dan AI</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>WhatsApp Setting</h3>
        </div>
        <div class="form-group">
          <label>Nomor Admin (format: 628xxxxxxxxxx)</label>
          <input type="text" id="settingAdminNumber" placeholder="6281234567890">
        </div>
        <div class="form-group">
          <label>Nama Bot</label>
          <input type="text" id="settingBotName" placeholder="RotiBot">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Ollama Setting</h3>
        </div>
        <div class="form-group">
          <label>URL Ollama Server</label>
          <input type="text" id="settingOllamaUrl" placeholder="http://localhost:11434">
        </div>
        <div class="form-group">
          <label>Model Name</label>
          <input type="text" id="settingOllamaModel" placeholder="aurum-brain">
        </div>
        <div class="form-group">
          <label>Temperature (0-2)</label>
          <input type="number" id="settingTemperature" min="0" max="2" step="0.1" value="0.7">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
      </div>
    </main>
  </div>

  <script>
    // Load settings
    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        document.getElementById('settingAdminNumber').value = settings.adminNumber || '';
        document.getElementById('settingBotName').value = settings.botName || '';
        document.getElementById('settingOllamaUrl').value = settings.ollamaUrl || '';
        document.getElementById('settingOllamaModel').value = settings.ollamaModel || '';
        document.getElementById('settingTemperature').value = settings.temperature || 0.7;
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // Save settings
    async function saveSettings() {
      const settings = {
        adminNumber: document.getElementById('settingAdminNumber').value,
        botName: document.getElementById('settingBotName').value,
        ollamaUrl: document.getElementById('settingOllamaUrl').value,
        ollamaModel: document.getElementById('settingOllamaModel').value,
        temperature: parseFloat(document.getElementById('settingTemperature').value)
      };
      
      try {
        await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings)
        });
        showToast('Setting berhasil disimpan!');
      } catch (error) {
        showToast('Gagal menyimpan setting', true);
      }
    }

    // Toast notification
    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    loadSettings();
  </script>
</body>
</html>
