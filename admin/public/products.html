<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/">📊 Dashboard</a>
        <a href="/products" class="active">🍞 Produk</a>
        <a href="/templates">💬 Template</a>
        <a href="/settings">⚙️ Setting</a>
        <a href="/logs">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Kelola Produk</h2>
        <p>Tambah, edit, atau hapus produk toko roti</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Daftar Produk</h3>
          <button class="btn btn-primary" onclick="openModal()">+ Tambah Produk</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nama</th>
                <th>Kategori</th>
                <th>Harga</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="productsTable">
              <tr>
                <td colspan="5" class="empty-state">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Tambah/Edit -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Tambah Produk</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="productDesc" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Harga (Rp)</label>
          <input type="number" id="productPrice" required>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="productCategory">
            <option value="Roti Manis">Roti Manis</option>
            <option value="Roti Gurih">Roti Gurih</option>
            <option value="Kue Kering">Kue Kering</option>
            <option value="Minuman">Minuman</option>
          </select>
        </div>
        <div class="form-group">
          <label>URL Foto</label>
          <input type="url" id="productImage" placeholder="https://...">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let products = [];

    // Load products
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        products = await res.json();
        renderProducts();
      } catch (error) {
        console.error('Error:', error);
      }
    }

    // Render products table
    function renderProducts() {
      const tbody = document.getElementById('productsTable');
      if (products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><div class="icon">🍞</div><p>Belum ada produk</p></td></tr>';
        return;
      }
      
      tbody.innerHTML = products.map(p => `
        <tr>
          <td><img src="${p.image_url || 'https://via.placeholder.com/60'}" alt="${p.name}" class="product-img"></td>
          <td>${p.name}</td>
          <td>${p.category}</td>
          <td>Rp ${p.price.toLocaleString('id-ID')}</td>
          <td>
            <button class="btn btn-sm" onclick="editProduct(${p.id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    // Open modal
    function openModal(product = null) {
      document.getElementById('productModal').classList.add('active');
      if (product) {
        document.getElementById('modalTitle').textContent = 'Edit Produk';
        document.getElementById('productId').value = product.id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productDesc').value = product.description || '';
        document.getElementById('productPrice').value = product.price;
        document.getElementById('productCategory').value = product.category;
        document.getElementById('productImage').value = product.image_url || '';
      } else {
        document.getElementById('modalTitle').textContent = 'Tambah Produk';
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
      }
    }

    // Close modal
    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    // Edit product
    function editProduct(id) {
      const product = products.find(p => p.id === id);
      if (product) openModal(product);
    }

    // Save product
    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('productId').value;
      const data = {
        name: document.getElementById('productName').value,
        description: document.getElementById('productDesc').value,
        price: parseInt(document.getElementById('productPrice').value),
        category: document.getElementById('productCategory').value,
        image_url: document.getElementById('productImage').value
      };

      try {
        const url = id ? `/api/products/${id}` : '/api/products';
        const method = id ? 'PUT' : 'POST';
        await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        closeModal();
        loadProducts();
        showToast('Produk berhasil disimpan!');
      } catch (error) {
        showToast('Gagal menyimpan produk', true);
      }
    }

    // Delete product
    async function deleteProduct(id) {
      if (!confirm('Yakin hapus produk ini?')) return;
      try {
        await fetch(`/api/products/${id}`, { method: 'DELETE' });
        loadProducts();
        showToast('Produk berhasil dihapus!');
      } catch (error) {
        showToast('Gagal menghapus produk', true);
      }
    }

    // Toast notification
    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    loadProducts();
  </script>
</body>
</html>
