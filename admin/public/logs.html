<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log - Admin Panel</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .log-card {
      background: var(--bg-tertiary);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }
    .log-card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .log-card-header .name { font-weight: 500; }
    .log-card-header .time { color: var(--text-secondary); }
    .log-card-phone { color: var(--text-secondary); font-size: 0.75rem; margin-bottom: 8px; }
    .log-card-msg { font-size: 0.85rem; margin-bottom: 6px; }
    .log-card-msg .label { color: var(--text-secondary); font-size: 0.75rem; }
    .log-card-response { background: var(--bg-secondary); padding: 8px; border-radius: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar - Desktop -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🍞 Aurum CS Bot</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/index.html">📊 Dashboard</a>
        <a href="/products.html">🍞 Produk</a>
        <a href="/templates.html">💬 Template</a>
        <a href="/settings.html">⚙️ Setting</a>
        <a href="/logs.html" class="active">📋 Log</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="page-header">
        <h2>Log Percakapan</h2>
        <p>Riwayat chat yang di-forward</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Riwayat</h3>
          <button class="btn btn-sm" onclick="loadLogs()">🔄</button>
        </div>
        
        <!-- Desktop Table -->
        <div class="table-container">
          <table class="table-desktop">
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Nama</th>
                <th>No HP</th>
                <th>Pesan</th>
                <th>Respons</th>
              </tr>
            </thead>
            <tbody id="logsTable">
              <tr><td colspan="5" class="empty-state">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
        
        <!-- Mobile Card View -->
        <div class="card-view" id="logsCardView">
          <div class="empty-state">
            <div class="icon">📋</div>
            <p>Memuat...</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Tab Bar - Mobile -->
    <nav class="tab-bar">
      <div class="tab-bar-nav">
        <a href="/index.html"><span class="tab-icon">🏠</span><span>Home</span></a>
        <a href="/products.html"><span class="tab-icon">🍞</span><span>Produk</span></a>
        <a href="/templates.html"><span class="tab-icon">💬</span><span>Template</span></a>
        <a href="/settings.html"><span class="tab-icon">⚙️</span><span>Setting</span></a>
        <a href="/logs.html" class="active"><span class="tab-icon">📋</span><span>Log</span></a>
      </div>
    </nav>
  </div>

  <script>
    let logs = [];

    async function loadLogs() {
      try {
        const res = await fetch('/api/logs');
        logs = await res.json();
        renderLogs();
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function renderLogs() {
      const tbody = document.getElementById('logsTable');
      const cardView = document.getElementById('logsCardView');
      
      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada percakapan</td></tr>';
        cardView.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>Belum ada percakapan</p></div>';
        return;
      }
      
      const reversed = [...logs].reverse();
      
      // Desktop table
      tbody.innerHTML = reversed.map(log => `
        <tr>
          <td style="white-space:nowrap;">${new Date(log.timestamp).toLocaleString('id-ID')}</td>
          <td>${log.customer_name || '-'}</td>
          <td>${log.customer_phone}</td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${log.message}</td>
          <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${log.response}</td>
        </tr>
      `).join('');
      
      // Mobile card view
      cardView.innerHTML = reversed.map(log => `
        <div class="log-card">
          <div class="log-card-header">
            <span class="name">${log.customer_name || 'Unknown'}</span>
            <span class="time">${new Date(log.timestamp).toLocaleString('id-ID')}</span>
          </div>
          <div class="log-card-phone">📱 ${log.customer_phone}</div>
          <div class="log-card-msg">
            <div class="label">Pesan:</div>
            ${log.message}
          </div>
          <div class="log-card-response">
            <div class="label">Respons:</div>
            ${log.response}
          </div>
        </div>
      `).join('');
    }

    loadLogs();
  </script>
</body>
</html>
